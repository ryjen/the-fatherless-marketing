name: Materialize raster correction

on:
  push:
    branches:
      - design/raster-and-trilogy-questions

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install validation dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Apply correction
        run: python3 scripts/apply-raster-correction.py
      - name: Validate source boundary
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test responsive media
        run: node tests/test-responsive-media.mjs
      - name: Build
        run: sh scripts/build.sh
      - name: Validate
        run: sh scripts/validate.sh
      - name: Commit corrected tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Materialize cinematic heroes and strengthen trilogy questions"
          git push origin HEAD:design/raster-and-trilogy-questions
