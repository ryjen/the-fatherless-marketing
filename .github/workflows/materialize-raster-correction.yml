name: Materialize raster correction

on:
  push:
    branches:
      - design/raster-and-trilogy-questions

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply correction
        run: python3 scripts/apply-raster-correction.py
      - name: Validate source boundary
        run: python3 scripts/publication.py source
      - name: Test responsive media
        run: node tests/test-responsive-media.mjs
      - name: Build
        run: ./scripts/build.sh
      - name: Validate
        run: ./scripts/validate.sh
      - name: Commit corrected tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Materialize cinematic heroes and strengthen trilogy questions"
          git push origin HEAD:design/raster-and-trilogy-questions
