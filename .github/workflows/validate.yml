name: Validate public site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Validate, build, and browser-test public site
        run: mise run check
      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy validated site to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install Node dependencies for deployment diagnostics
        run: mise run deps
      - name: Require GitHub Actions Pages source
        id: pages-state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node tools/site.mjs pages-state
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify Pages deployment without custom domain
        if: steps.pages-state.outputs.custom_domain == ''
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/site.mjs origin "$SITE_URL"
      - name: Probe Cloudflare custom-domain edge
        if: steps.pages-state.outputs.custom_domain != ''
        id: edge-probe
        continue-on-error: true
        env:
          SITE_URL: https://${{ steps.pages-state.outputs.custom_domain }}/
        run: |
          node tools/site.mjs origin "$SITE_URL"
          node tools/site.mjs cloudflare "$SITE_URL"
      - name: Record Cloudflare probe result
        if: steps.pages-state.outputs.custom_domain != '' && always()
        env:
          EDGE_OUTCOME: ${{ steps.edge-probe.outcome }}
          SITE_URL: https://${{ steps.pages-state.outputs.custom_domain }}/
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EDGE_OUTCOME" = "success" ]; then
            echo "Cloudflare custom-domain probe passed: ${SITE_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub-hosted runner could not verify the Cloudflare edge. Pages deployment succeeded; Cloudflare may intentionally deny datacenter automation. Validate the public hostname in a normal browser and Cloudflare Security events before treating this as an outage."
            {
              echo '### Cloudflare edge diagnostic'
              echo
              echo "- Target: \`${SITE_URL}\`"
              echo "- GitHub-runner probe: **${EDGE_OUTCOME}**"
              echo '- Pages deployment: **success**'
              echo '- This edge probe is diagnostic because Cloudflare policy can intentionally block GitHub-hosted datacenter traffic.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
