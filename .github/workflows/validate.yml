name: Validate public site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test publication boundary
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install visual validation dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test responsive media generation
        run: node tests/test-responsive-media.mjs
      - name: Build
        run: sh scripts/build.sh
      - name: Validate
        run: sh scripts/validate.sh
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        env:
          SITE_BASE_URL: http://127.0.0.1:4173/the-fatherless-marketing/
        run: |
          mkdir -p /tmp/pages-origin/the-fatherless-marketing
          cp -R dist/. /tmp/pages-origin/the-fatherless-marketing/
          python3 -m http.server 4173 --directory /tmp/pages-origin >/tmp/fatherless-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test tests/browser-smoke.spec.js --reporter=line
      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy validated site to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/pages-state.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages")"

          case "$status" in
            200)
              build_type="$(python3 - <<'PY'
import json
from pathlib import Path
state = json.loads(Path('/tmp/pages-state.json').read_text())
print(state.get('build_type', ''))
PY
)"
              if [ "$build_type" != "workflow" ]; then
                source="$(python3 - <<'PY'
import json
from pathlib import Path
state = json.loads(Path('/tmp/pages-state.json').read_text())
source = state.get('source') or {}
branch = source.get('branch', '?')
path = source.get('path', '?')
print(f'{branch}:{path}')
PY
)"
                echo "::error::GitHub Pages is using legacy branch publishing (${source}). In Settings > Pages > Build and deployment, set Source to GitHub Actions. The validated dist artifact must be the only deployment source."
                exit 1
              fi
              ;;
            404)
              echo '::error::GitHub Pages is disabled. In Settings > Pages > Build and deployment, set Source to GitHub Actions.'
              exit 1
              ;;
            *)
              cat /tmp/pages-state.json
              echo "Unexpected GitHub Pages API status: ${status}" >&2
              exit 1
              ;;
          esac
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify deployed Pages origin
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: sh scripts/verify-origin.sh "$SITE_URL"
