name: Review cinematic homepage v2 refinement

on:
  push:
    branches:
      - design/cinematic-home-hierarchy

permissions:
  contents: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Apply visual review fixes
        run: python3 scripts/refine-home-v2-review.py

      - name: Validate publication boundary
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test responsive media generation
        run: node tests/test-responsive-media.mjs

      - name: Build and validate
        run: |
          sh scripts/build.sh
          sh scripts/validate.sh

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        env:
          SITE_BASE_URL: http://127.0.0.1:4173/the-fatherless-marketing/
        run: |
          mkdir -p /tmp/pages-origin/the-fatherless-marketing
          cp -R dist/. /tmp/pages-origin/the-fatherless-marketing/
          python3 -m http.server 4173 --directory /tmp/pages-origin >/tmp/fatherless-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test tests/browser-smoke.spec.js --reporter=line

      - name: Capture refined visual review
        run: |
          mkdir -p /tmp/pages-origin/the-fatherless-marketing visual-review
          cp -R dist/. /tmp/pages-origin/the-fatherless-marketing/
          python3 -m http.server 4173 --directory /tmp/pages-origin >/tmp/fatherless-review-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const spec of [
              { name: 'homepage-refined-1440.png', width: 1440, height: 1000 },
              { name: 'homepage-refined-375.png', width: 375, height: 812 },
            ]) {
              const page = await browser.newPage({ viewport: { width: spec.width, height: spec.height } });
              await page.goto('http://127.0.0.1:4173/the-fatherless-marketing/', { waitUntil: 'networkidle' });
              const height = await page.evaluate(() => document.documentElement.scrollHeight);
              for (let y = 0; y < height; y += Math.max(300, Math.floor(spec.height * 0.7))) {
                await page.evaluate(value => window.scrollTo(0, value), y);
                await page.waitForTimeout(90);
              }
              await page.evaluate(() => window.scrollTo(0, 0));
              await page.waitForTimeout(150);
              await page.screenshot({ path: `visual-review/${spec.name}`, fullPage: true });
              await page.close();
            }
            await browser.close();
          })();
          NODE

      - name: Upload refined visual review captures
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-home-v2-refined-captures
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 3

      - name: Commit refined homepage
        run: |
          rm -rf visual-review scripts/refine-home-v2-review.py .github/workflows/review-home-v2-refinement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Refine cinematic homepage hierarchy"
          git push origin HEAD:design/cinematic-home-hierarchy
