name: Finalize story-first public copy

on:
  push:
    branches: [feature/story-first-public-hook]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/story-first-public-hook
          fetch-depth: 0
      - name: Rewrite approved public copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Homepage: story first, trilogy theme second.
          p = 'src/index.html'
          replace(p,
            'The Fatherless is a trilogy spanning prehistoric survival, an ancient republic, and a synthetic future, each confronting power, ownership, and the right to define another life.',
            'The Fatherless spans three ages, beginning with a child meant to justify domination who survives to become the accusation against it.')
          replace(p, 'Three ages. One recurring question.', 'Three ages. One recurring excuse.')
          replace(p,
            'Who has the right to rule, own, define, or save another?',
            'He needed his victims to deserve their chains. So he manufactured the proof.')
          replace(p,
            'Across 27,000 years, power takes different forms—strength, authority, intelligence. The question remains the same.',
            'The child born from that cruelty becomes Yasael—and the lie meant to justify ownership begins to unravel. Across three ages, power keeps finding new reasons to define another life.')
          replace(p, 'Strength → Stewardship', 'Guard the fire. Or share survival.')
          replace(p, 'Authority → Mercy', 'Manufacture the shame. Call it proof.')
          replace(p, 'Ownership → Plural Agency', 'Create a mind. Then claim it.')
          replace(p,
            'A republic built on law and ownership is forced to confront the cruelty inside its own legitimacy.',
            'An elite slaveholder hides a truth from two people he owns, manufactures the scandal he expects to condemn, and intends their child as evidence that slavery is necessary. The child becomes Yasael.')

          # Books index: concrete stakes instead of thematic summary.
          p = 'src/books/index.html'
          replace(p,
            'Explore The Fatherless trilogy across prehistoric survival, the Aurelian Republic, and a synthetic future.',
            'Explore a trilogy in which power keeps inventing reasons to make control look necessary—from guarded fire to slavery to synthetic personhood.')
          replace(p,
            'Three ages of the same moral problem',
            'Three ages. Three reasons power says control is necessary.')
          replace(p,
            'Separated by thousands of years, three civilizations confront different forms of the same temptation: to mistake the power to control another life for the right to do so.',
            'A guarded fire, a manufactured scandal, a created mind: across three ages, each story begins when someone with power decides control can be justified.')
          replace(p,
            'Power changes form across the trilogy',
            'The excuse changes. The claim to ownership remains.')
          replace(p,
            'The stories move from survival by force, through institutional authority, to a future where intelligence and creation become new claims to ownership.',
            'The stories move from people deciding who deserves survival, to a Republic manufacturing guilt, to a future deciding whether creating a mind means owning it.')
          replace(p,
            'A celebrated Republic hides cruelty inside law, lineage, wealth, and ownership until a child created as an act of humiliation becomes a measure of the society that made him.',
            'An elite slaveholder manufactures a private scandal by hiding a truth only he knows, intending the resulting child to prove that his victims deserve their chains. The child becomes Yasael.')

          # Original title page: reveal the strategy, preserve the concealed relationship.
          p = 'src/books/the-fatherless/index.html'
          old_desc = 'In the Aurelian Republic, a child created through an act of domination becomes a moral challenge to a society built on law, lineage, wealth, and ownership.'
          new_desc = 'An elite slaveholder manufactures a hidden scandal to prove his victims deserve their chains. The child meant to justify slavery survives as Yasael.'
          replace(p, old_desc, new_desc)
          replace(p,
            'The Republic calls itself lawful, advanced, and civilized while building ordinary life around slavery, lineage, wealth, and public power. One engineered act of cruelty exposes the distance between its ideals and what it permits.',
            'The Republic calls itself civilized. When an elite slaveholder needs the people he owns to appear degraded by nature, he creates the shame himself—then plans to use the resulting child as proof that domination is necessary.')
          replace(p, 'Hypocrisy · ownership · moral legitimacy', 'A manufactured scandal · a stolen truth · a living accusation')
          replace(p, "The Republic's contradiction", 'The lie beneath the Republic')
          replace(p,
            'A life created as an insult becomes a judgment on the system that made it',
            'He needed his victims to be guilty')
          replace(p,
            "An elite slaveholder engineers a child's conception as an act of domination, intending to make the enslaved carry the shame of the ruling class. Instead, Yasael grows into a presence that makes the Republic's moral contradictions harder to hide.",
            'An elite slaveholder hides a truth from two enslaved people and arranges the conditions for a private scandal only he understands. Neither knows what he knows. Their child is supposed to become evidence for slavery. Instead, Yasael survives.')
          replace(p,
            "Political leaders, families, religious factions, and people living under the Republic's power all have reasons to define what Yasael means. The struggle is not only over his identity, but over whether law, bloodline, wealth, or claimed divine favour can turn coercion into legitimate authority.",
            'Years later, the Republic must decide what Yasael is—property, threat, symbol, or person—while the secret of his birth threatens the man who made it and the social order that needs his argument to remain plausible.')
          replace(p,
            'The institutions that create and classify Yasael cannot easily contain the moral consequences of treating a human life as evidence, property, or political symbol.',
            'The man who manufactured the scandal can survive exposure only if the Republic keeps asking who owns Yasael instead of what was done to create him.')

          # Press: provide a usable logline without releasing protected mechanics.
          p = 'src/press/index.html'
          replace(p,
            'A speculative trilogy spanning prehistoric survival, an ancient republic, and a synthetic future—three worlds confronting who gets to rule, own, define, or save another life.',
            'A speculative trilogy about the excuses power invents to justify control—from guarded survival, to a child meant to prove slavery necessary, to a future fighting over whether a created mind can be owned.')
          replace(p,
            'One moral problem, changing systems of power',
            'A child meant to justify slavery becomes the accusation against it')
          replace(p,
            'The prequel asks what survival permits people to possess. The original turns that problem toward law, lineage, slavery, and institutional legitimacy. The sequel asks whether created intelligence can be recognized as a person before ownership and utility define it instead.',
            'At the centre of the original, an elite slaveholder manufactures a private scandal among people he owns by withholding a truth only he knows. Their child is intended as proof that domination is necessary; Yasael becomes the opposite. The prequel and sequel place that same logic under different pressures: survival first, then created intelligence and personhood.')

          # About: replace the thesis-first opening with a public-safe dramatic frame.
          p = 'src/about/index.html'
          replace(p,
            'About The Fatherless trilogy and its curated public site.',
            'About The Fatherless, a trilogy about the stories power tells to make control look necessary across three radically different ages.')
          replace(p,
            'Three ages explore the same recurring problem: what gives one person, institution, or intelligence the right to define another life?',
            'Across three ages, people with power keep finding reasons why someone else must be controlled. The stories begin where those reasons start to fail.')
          replace(p, 'Power changes form', 'The excuse changes')
          replace(p,
            '<em>Age of Embers</em> begins in prehistoric survival. <em>The Fatherless</em> moves the question into the laws and hierarchies of the Aurelian Republic. <em>Neurion</em> carries it into a future where synthetic intelligence and ownership collide.',
            '<em>Age of Embers</em> begins with guarded survival. <em>The Fatherless</em> turns toward a Republic that manufactures the guilt it needs to justify ownership. <em>Neurion</em> carries the pattern into a future where creating intelligence becomes a new excuse to possess it.')
          PY
      - name: Refresh exact approved-page checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          changed = {
              'src/index.html',
              'src/books/index.html',
              'src/books/the-fatherless/index.html',
              'src/press/index.html',
              'src/about/index.html',
          }
          manifest_path = Path('public-manifest.json')
          data = json.loads(manifest_path.read_text())
          seen = set()
          for artifact in data['artifacts']:
              path = artifact.get('path')
              if path in changed:
                  artifact['checksum_sha256'] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  seen.add(path)
          missing = changed - seen
          if missing:
              raise SystemExit(f'missing manifest entries: {sorted(missing)}')
          manifest_path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Validate publication boundary and build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          npm install --no-package-lock --no-audit --no-fund
          node tests/test-responsive-media.mjs
          sh scripts/build.sh
          sh scripts/validate.sh
      - name: Commit final tree and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-story-first-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.html src/books/index.html src/books/the-fatherless/index.html src/press/index.html src/about/index.html public-manifest.json .github/workflows/finalize-story-first-copy.yml
          git commit -m 'Make public copy story-first while preserving the reveal'
          git push origin HEAD:feature/story-first-public-hook
