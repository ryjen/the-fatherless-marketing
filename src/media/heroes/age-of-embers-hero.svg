  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="17"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
  </filter>
  <radialGradient id="vignette">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="68%" stop-color="#000" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.52"/>
  </radialGradient>
