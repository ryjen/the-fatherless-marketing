[tools]
node = "24"

[tasks.deps]
description = "Install exact top-level Node dependencies"
run = "npm install --no-package-lock --no-audit --no-fund"

[tasks.source]
description = "Validate the public content model, manifest boundary, rights metadata, release state, production hero contract, and setting language"
depends = ["deps"]
run = "node tools/site.mjs source && node tools/validate-release-state.mjs && node tools/validate-public-language.mjs"

[tasks.contracts]
description = "Run Node contract tests for publication, release state, and responsive media"
depends = ["deps"]
run = "node --test tests/*.test.mjs"

[tasks.build]
description = "Build dist from manifest-backed publishable source"
depends = ["source"]
run = "node tools/site.mjs build"

[tasks.validate]
description = "Validate the built artifact and performance budgets"
depends = ["build"]
run = "node tools/site.mjs validate"

[tasks."browser:install"]
description = "Install Chromium and its hosted-runner dependencies"
depends = ["deps"]
run = "npx playwright install --with-deps chromium"

[tasks.browser]
description = "Run browser smoke against the built public site"
depends = ["validate", "browser:install"]
run = "node tools/site.mjs browser"

[tasks.check]
description = "Run the complete public-site validation gate"
depends = ["contracts", "browser"]
run = "node --check tools/site.mjs && node --check tools/validate-release-state.mjs && node --check tools/validate-public-language.mjs"
